<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andrés y Cocó · 9 de enero de 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Allison&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#f8f7f3;
  --tinta:#111111;
  --suave:#6e6c68;
  --linea:#cfcdc6;
  --script:'Allison','Snell Roundhand','Apple Chancery',cursive;
  --sans:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{
  margin:0;background:var(--papel);color:var(--tinta);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .43  0 0 0 0 .38  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.pagina{max-width:460px;margin:0 auto;padding:0 28px}
.cap{font-size:12px;letter-spacing:.34em;text-transform:uppercase;font-weight:400}
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:9vh 0 7vh}
.hero img{width:100%;max-width:400px;height:auto;display:block}
.lugar{margin:18px 0 0;color:var(--tinta)}
.centro{margin:auto 0;padding:48px 0}
.nombres{color:var(--suave);font-size:15px;letter-spacing:.28em;text-transform:uppercase;margin:0 0 18px}
.titulo{font-size:17px;letter-spacing:.5em;font-weight:600;margin:0;padding-left:.5em;line-height:1.5;text-transform:uppercase;white-space:nowrap}
.fecha{font-family:var(--script);font-size:84px;line-height:1;margin:0}
.anio{margin:10px 0 0;color:var(--suave)}
.bajar{margin-top:30px;color:var(--suave);font-size:11px;letter-spacing:.3em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--linea);padding-bottom:4px}
section{padding:56px 0;border-top:1px solid var(--linea);text-align:center}
h2{font-size:12px;letter-spacing:.34em;text-transform:uppercase;font-weight:500;margin:0 0 28px;padding-left:.34em}
.texto{font-size:17px;line-height:1.75;font-weight:300;margin:0 auto;max-width:340px}
.dato{margin:0 0 26px}
.dato .k{display:block;color:var(--suave);font-size:11px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:6px}
.dato .v{font-size:19px;font-weight:300;line-height:1.5}
.pendiente{border-bottom:1px dashed var(--suave);color:var(--suave)}
.hola{font-size:16px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;line-height:1.4;margin:0 0 10px;padding-left:.32em}
.sub{color:var(--suave);font-size:14px;font-weight:300;margin:0 0 28px;line-height:1.6}
.opt,.mini,.btn{font-family:var(--sans);cursor:pointer;background:transparent;color:var(--tinta);border:1px solid var(--tinta);border-radius:0;letter-spacing:.08em}
.opt{display:block;width:100%;padding:16px 14px;margin:0 0 10px;font-size:14px;text-align:center}
.opt:hover,.mini:hover,.btn:hover{background:rgba(17,17,17,.05)}
.sel{background:var(--tinta)!important;color:var(--papel)!important}
.btn{width:100%;padding:16px;margin-top:10px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;font-weight:500}
.btn.lleno{background:var(--tinta);color:var(--papel)}
.persona{font-size:15px;letter-spacing:.28em;text-transform:uppercase;font-weight:500;margin:28px 0 0;padding-left:.28em}
.lbl{color:var(--suave);font-size:11px;letter-spacing:.3em;text-transform:uppercase;margin:16px 0 8px}
.fila{display:flex;gap:8px}
.mini{flex:1;padding:12px 6px;font-size:13px}
.ok{padding:30px 0 6px}
.ok .fecha{font-size:68px}
.ok p{margin:12px 0 0}
.prueba{margin:0 0 34px;padding:10px 0 12px;border-top:1px dashed var(--linea);border-bottom:1px dashed var(--linea)}
.prueba span{display:block;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--suave);margin-bottom:8px}
.prueba button{font-family:var(--sans);font-size:12px;background:none;border:1px solid var(--linea);color:var(--suave);padding:6px 10px;margin:3px;cursor:pointer}
.prueba button.sel{border-color:var(--tinta)}
footer{padding:48px 0 64px;text-align:center;border-top:1px solid var(--linea)}
footer .fecha{font-size:62px}
.donde{font-size:15px;font-weight:300;line-height:1.7;margin:-8px 0 26px;color:var(--suave)}
.tu{display:inline-block;border:1px solid var(--tinta);padding:10px 16px;font-size:12px;letter-spacing:.26em;text-transform:uppercase;margin:0 0 34px}
.prog{margin:0 0 30px}.intro{font-size:15px;font-weight:300;color:var(--suave);margin:26px 0 8px}.evento{font-size:16px;letter-spacing:.3em;text-transform:uppercase;font-weight:500;margin:0 0 8px;padding-left:.3em}.det{font-size:17px;font-weight:300;line-height:1.7;margin:0}
.tarjeta{position:relative;border:1px solid var(--tinta);padding:46px 18px 40px;margin:0 auto}
.tarjeta::before{content:"";position:absolute;inset:6px;border:1px solid var(--tinta);pointer-events:none}
.l{font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;line-height:2.1;margin:0;font-weight:300;padding-left:.22em}
.l.m{font-size:15px;font-weight:500;letter-spacing:.3em;margin:8px 0;padding-left:.3em}
.l.g{margin-top:22px}
.l.vest{margin-top:34px;color:var(--suave);font-size:11px;letter-spacing:.3em}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.tarjeta{padding:56px 18px 50px}
.e{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:19px;color:var(--suave);margin:0 0 14px}
.t{font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;margin:0 0 22px;padding-left:.3em;line-height:1.5}
.c{font-family:'Cormorant Garamond',Georgia,serif;font-size:16.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;margin:0 0 4px;padding-left:.16em;line-height:1.7}
.s{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:17px;color:var(--suave);margin:0 0 4px;line-height:1.6}
.enl{margin:14px 0 0;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase}
.enl a{color:var(--tinta);text-decoration:none;border-bottom:1px solid var(--linea);padding-bottom:2px}
.enl span{margin:0 10px;color:var(--linea)}
.orn{width:34px;height:1px;background:var(--tinta);margin:38px auto 36px}
.bloque2{margin-top:8px}
.t2{font-size:17px;letter-spacing:.2em;padding-left:.2em}
.tarjeta{border:0;padding:8px 6px 4px}
.tarjeta::before{display:none}
.f{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;line-height:1.6;font-weight:400;margin:0 auto;max-width:340px}
.f em{color:var(--suave)}
.f+.enl{margin-top:16px}
.sep{height:34px}
#detalles{text-align:left;padding-left:6px;padding-right:6px}
#detalles h2{padding-left:0;margin-bottom:30px}
.l2{font-size:19px;font-weight:300;line-height:1.6;margin:0 0 20px}
.l2 b{font-weight:600}
.l2 a{color:inherit;text-decoration:none;border-bottom:1px solid var(--tinta)}
.pie{margin-top:40px;display:grid;gap:22px}
.pie1{font-size:13.5px;line-height:1.55;color:var(--suave);display:flex;flex-direction:column;gap:2px}
.pie1 b{color:var(--tinta);font-weight:600}
.pie1 a{color:inherit;text-decoration:none;border-bottom:1px solid var(--linea)}
[hidden]{display:none!important}
</style>
</head>

<script>
const P=[["Fran","Juampa","todo"]];
const LUGAR={ceremonia:"Lo Pinto",cocktail:"Lo Pinto",fiesta:"Lo Pinto"};
const ARTICULO={ceremonia:"una ceremonia",cocktail:"un cocktail",fiesta:"una fiesta"};
const INCLUYE={ceremonia:["ceremonia","cocktail","fiesta"],cocktail:["cocktail","fiesta"],fiesta:["fiesta"]};
const conMenu=()=>P[ix][2]!=="fiesta";
const $=id=>document.getElementById(id);
let op=null,ix=0;

function opciones(){
  const [a,b]=P[ix];
  const o=b
    ?[["dos","Confirmamos los dos"],["a","Solo va "+a],["b","Solo va "+b],["no","No podemos ir"]]
    :[["yo","Confirmo"],["no","No puedo ir"]];
  $('s1').innerHTML=o.map(([k,t])=>`<button class="opt" data-o="${k}">${t}</button>`).join('')
    +'<button id="go" class="btn lleno" hidden>Seguir</button>';
  $('s1').querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
    op=btn.dataset.o;
    $('s1').querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    btn.classList.add('sel');
    $('go').hidden=false;
    $('go').textContent=op==='no'?'Enviar':'Seguir';
  });
  $('go').onclick=seguir;
}

const CAP={d:'Av. Pedro de Valdivia 425, Providencia',gm:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Capilla del Sagrado Corazón de Jesús, Av. Pedro de Valdivia 425, Providencia'),wz:'https://waze.com/ul?q='+encodeURIComponent('Av. Pedro de Valdivia 425, Providencia')+'&navigate=yes'};
const LP={d:'Lampa',gm:'https://maps.app.goo.gl/ac75fbSTQsM6YofZA',wz:'https://waze.com/ul?ll=-33.2715907,-70.7510924&navigate=yes'};
const mapa=p=>`<p class="enl"><a href="${p.gm}" target="_blank" rel="noopener">Google Maps</a><span>·</span><a href="${p.wz}" target="_blank" rel="noopener">Waze</a></p>`;
function programa(){
  const [a,b,t]=P[ix];
  const nom=b?a+' y '+b:a, inv=b?'Los queremos invitar':'Te queremos invitar';
  const ficha=(tit,dir,p)=>`<div class="pie1"><b>${tit}</b><span>${dir}</span><span><a href="${p.wz}" target="_blank" rel="noopener">Waze</a> &middot; <a href="${p.gm}" target="_blank" rel="noopener">Google Maps</a></span></div>`;
  const lista='<div class="pie1"><b>Lista de novios</b><span>Novios Falabella, código 2106844</span><span><a href="https://novios.falabella.com/info-evento/evento?codigoEvento=2106844" target="_blank" rel="noopener">Ver lista</a></span></div>';
  $('prog').innerHTML=t==='todo'
    ?`<p class="l2">Hola ${nom},</p><p class="l2">${inv} a acompañarnos en este día tan especial a una ceremonia religiosa en la Capilla del Sagrado Corazón de Jesús el día <b>sábado 9 de enero</b> a las <b>13:00 hrs en punto</b>, y después a una recepción en Camino Interior Lo Solar, Lampa.</p><div class="pie">${ficha('Dirección capilla','Av. Pedro de Valdivia 425, Providencia',CAP)}${ficha('Dirección recepción','Camino Interior Lo Solar, Lampa',LP)}${lista}</div>`
    :`<p class="l2">Hola ${nom},</p><p class="l2">${inv} a acompañarnos en este día tan especial a una ceremonia en la Capilla del Sagrado Corazón de Jesús el <b>sábado 9 de enero</b> a las <b>13:00 hrs en punto</b>.</p><p class="l2">Y a una fiesta desde las <b>17:30 hrs</b> en Lo Pinto.</p><div class="pie">${ficha('Dirección capilla','Av. Pedro de Valdivia 425, Providencia',CAP)}${ficha('Dirección Lo Pinto','Lampa, Región Metropolitana',LP)}${lista}</div>`;
}

function persona(n,i){
  const menu=conMenu()?`<p class="lbl">Menú</p>
  <div class="fila"><button class="mini" data-g="m${i}">Normal</button><button class="mini" data-g="m${i}">Vegetariano</button></div>`:'';
  return `<p class="persona">${n}</p>
  ${menu}
  <p class="lbl">Alcohol</p>
  <div class="fila"><button class="mini" data-g="a${i}">Sí</button><button class="mini" data-g="a${i}">No</button></div>`;
}

function seguir(){
  $('s1').hidden=true;
  if(op==='no'){
    $('sub').hidden=true;
    $('finTitulo').textContent='Gracias';
    $('fin').textContent='Gracias por avisarnos.';
    $('s3').hidden=false;return;
  }
  const [a,b]=P[ix];const g=op==='dos'?[a,b]:op==='b'?[b]:[a];
  $('sub').hidden=true;
  $('s2').innerHTML=g.map(persona).join('')+'<button id="env" class="btn lleno" style="margin-top:30px">Enviar</button>';
  $('s2').hidden=false;
  $('s2').querySelectorAll('.mini').forEach(b=>b.onclick=()=>{
    $('s2').querySelectorAll(`[data-g="${b.dataset.g}"]`).forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
  });
  $('env').onclick=()=>{
    $('s2').hidden=true;$('sub').hidden=true;
    $('finTitulo').textContent='Listo';
    $('fin').textContent=g.length>1
      ?'Quedó confirmada la asistencia de '+g[0]+' y '+g[1]+'.'
      :'Quedó confirmada tu asistencia.';
    $('s3').hidden=false;
  };
}

document.querySelectorAll('.ej').forEach(b=>b.onclick=()=>{
  ix=+b.dataset.i;
  document.querySelectorAll('.ej').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');
  reset();
});

reset();
</script>
